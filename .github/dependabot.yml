version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which is the safe thing to do
  # and also means nothing updates them without help. Dependabot understands
  # SHA pins and bumps them while keeping the `# vX.Y.Z` comment accurate.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ':arrow_up: build'
    groups:
      actions:
        patterns: ['*']

  # docker/sftp/Dockerfile pins its base image by digest, which is only safe
  # as long as something bumps it when Alpine ships a patch. This is that
  # something.
  - package-ecosystem: docker
    directory: /docker/sftp
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ':arrow_up: build'

  # compose.yaml pins the MinIO image by digest for the same reason, and
  # Chainguard only publishes `latest` without an account, so the digest is
  # the only thing that can move.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ':arrow_up: build'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: build'
    groups:
      # One PR per concern rather than ten. Dev tooling churns constantly and
      # is low risk; protocol SDKs are the ones worth reading carefully.
      dev-tooling:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'vitest'
          - 'fast-check'
          - 'turbo'
          - 'esbuild'
          - '@types/*'
      protocol-sdks:
        patterns:
          - '@aws-sdk/*'
          - 'basic-ftp'
          - 'ssh2*'
          - 'webdav'
      vscode:
        patterns:
          - '@vscode/*'
    ignore:
      # TypeScript 7 (the native compiler rewrite) is held back deliberately.
      # typescript-eslint 8.70.0 — the latest — declares
      # `typescript: ">=4.8.4 <6.1.0"`, so TS 7 would disable type-aware
      # linting entirely. The repo is on TS 6.0.x, the newest version inside
      # that supported range. Drop this entry once typescript-eslint ships
      # TS 7 support.
      - dependency-name: 'typescript'
        versions: ['>=7']
      # @types/node must track the Node version actually targeted (engines.node
      # is >=22 and CI runs 22). Letting it float to the newest major types the
      # code against APIs that are absent at runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # @types/vscode must not float above the `engines.vscode` floor declared
      # in apps/vscode/package.json, or the extension will compile against APIs
      # that are missing in the oldest VS Code it claims to support.
      - dependency-name: '@types/vscode'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
