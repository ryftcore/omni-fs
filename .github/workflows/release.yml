name: Release

# Pushing a `v<version>` tag is the whole release: verify, package, publish to
# Open VSX, then attach the same .vsix to a GitHub release.
#
# Running it by hand from a branch is a dry run — everything up to the packaged
# .vsix, uploaded as an artifact, plus a check that the Open VSX token can
# publish to the namespace, and nothing published. Running it by hand from an
# existing tag repeats that tag's release, which is how a failed publish is
# retried.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Two releases of one tag must never race each other to the registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  build:
    name: verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      version: ${{ steps.channel.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # VS Code's pre-release channel is not a semver suffix (`0.1.0-beta.1`):
      # it is a plain `major.minor.patch` whose .vsix carries a pre-release
      # flag, and the VS Code Marketplace, which gets this same .vsix by hand,
      # rejects a suffix outright. So the channel follows VS Code's own
      # recommendation: an odd minor is a pre-release, an even minor is
      # stable. Pre-release users are moved to a stable build once its
      # version is higher, so 0.1.x pre-releases hand over to 0.2.0 without
      # anyone reinstalling.
      #
      # A tag that disagrees with the manifest would publish a .vsix whose
      # version does not match the release it is attached to, so that is
      # checked here too, before anything is built.
      - name: Resolve version and channel
        id: channel
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/vscode/package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::apps/vscode/package.json version '$version' must be plain major.minor.patch — a pre-release is a flag, not a suffix. Use an odd minor for a pre-release."
            exit 1
          fi
          minor="${BASH_REMATCH[1]}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/vscode/package.json version $version."
            exit 1
          fi
          prerelease=$([ $((minor % 2)) -eq 1 ] && echo true || echo false)
          echo "version $version, pre-release $prerelease"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Never ship a release that would not have passed CI.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # `package:vsix` with the pre-release flag passed through turbo to the
      # trailing `vsce package`. The flag has to be set here: it is written
      # into the .vsix manifest, which is the only place Open VSX reads it
      # from — `ovsx publish` ignores `--pre-release` for a prepackaged .vsix.
      - name: Package extension
        env:
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            pnpm exec turbo run package --filter=omni-fs-vscode -- --pre-release
          else
            pnpm package:vsix
          fi

      - name: Check the bundle stayed lean
        run: |
          VSIX=$(ls apps/vscode/*.vsix)
          SIZE=$(( $(wc -c < "$VSIX") / 1024 ))
          echo "$VSIX is ${SIZE} KB"
          if [ "$SIZE" -gt 2048 ]; then
            echo "::error::VSIX grew past 2 MB (${SIZE} KB). Check apps/vscode/.vscodeignore."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omni-fs-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error
          retention-days: 30

  open-vsx:
    name: publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # OVSX_PAT may be a repository secret or, scoped tighter, a secret on this
    # environment; either reaches the job. Required reviewers on the
    # environment, if set in the repository settings, become the approval
    # gate before a publish.
    #
    # The VS Code Marketplace is published by hand, from the .vsix attached to
    # the GitHub release, so no Marketplace token lives in this repository.
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/ryftcore/omni-fs-vscode

    steps:
      # Checked out only for the lockfile, so ovsx is the pinned version rather
      # than whatever `npx` resolves today.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter omni-fs-vscode

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omni-fs-vsix
          path: dist-vsix

      # Publishes the exact .vsix the build job verified, never a repackage;
      # its manifest already says whether it is a pre-release. --skip-duplicate
      # makes a retry after a later failure — the GitHub release, say — succeed
      # instead of stopping on "already published".
      #
      # A dry run stops at `verify-pat`, which asks the registry whether the
      # token may publish to the namespace, so a bad or expired token shows up
      # before a tag is pushed rather than after.
      #
      # The token check lives in the script: the `secrets` context is not
      # available to `if:`, so a guard there would silently skip the publish.
      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::The OVSX_PAT secret is not set."
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            pnpm --filter omni-fs-vscode exec ovsx verify-pat ryftcore
            exit 0
          fi
          VSIX=$(ls "$PWD"/dist-vsix/*.vsix)
          pnpm --filter omni-fs-vscode exec ovsx publish "$VSIX" --skip-duplicate

  github-release:
    name: GitHub release
    needs: [build, open-vsx]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # create the release and upload the .vsix

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omni-fs-vsix
          path: dist-vsix

      # After Open VSX, so a release page never offers a version Open VSX does
      # not have. This .vsix is also the one to upload to the VS Code
      # Marketplace by hand.
      #
      # The repository has immutable releases on: once a release is published,
      # nothing can be attached to it, and its tag can never be used again.
      # `gh release create` given files creates a draft, uploads to it, and
      # only then publishes — the order that survives immutability. An action
      # that publishes first and uploads second leaves an empty release that
      # can never be fixed.
      #
      # A retry finds the release already published and stops there, since an
      # immutable release cannot be changed anyway.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist-vsix/*.vsix "${flags[@]}"
