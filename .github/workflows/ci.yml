name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Any job needing more raises it for itself.
permissions:
  contents: read

env:
  # Turborepo phones home unless told otherwise.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # omni-fs normalises remote paths to POSIX and the extension ships on
        # all three desktop platforms, so path and line-ending behaviour is
        # worth testing everywhere rather than trusting Linux alone.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  extension-tests:
    name: extension tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Everything inside is bounded — Mocha's own timeout fails a wedged test —
    # but nothing bounds a hung editor download or an Electron host that never
    # exits, and the default is six hours of runner time. A cold cache on
    # Windows is the slow case at a few minutes; twenty leaves room for it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The same three-OS matrix as `verify`, for the reason that matrix
        # already states: the extension ships on all three desktop platforms.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The download key must change when VS Code does, or actions/cache never
      # saves: it skips the upload on an exact key hit, so a key pinned only to
      # the lockfile would re-download 150 MB on every run after a release and
      # store none of it. A weekly stamp bounds that to one run in seven days.
      # `%G` rather than `%Y`: it is the ISO week-numbering year that belongs
      # with `%V`, so the first days of a January cannot reuse a key from the
      # year before.
      - id: stamp
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
        shell: bash

      # Only the editor download. The rest of .vscode-test is the runner's
      # user-data and extensions directories, which must not persist between
      # runs — stale omniFs.connections state would leak across jobs.
      #
      # `github.job` is in the key because this job's ubuntu leg and
      # `extension-tests-live` both resolve `runner.os` to Linux: one key for
      # both means whichever finishes second loses the save to a
      # ReserveCacheError warning, on every run, forever.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode/.vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ github.job }}-${{ steps.stamp.outputs.week }}
          restore-keys: vscode-test-${{ runner.os }}-${{ github.job }}-

      # Electron needs a display. Linux runners are headless, so xvfb provides
      # a virtual one; macOS and Windows runners have a real window server.
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:extension

      - if: runner.os != 'Linux'
        run: pnpm test:extension

  extension-tests-live:
    name: extension tests (live)
    runs-on: ubuntu-latest
    # Same reasoning as the job above, and here `docker compose up -d` and
    # `package:vsix` are two more steps with no bound of their own. The job
    # really takes about two minutes.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: stamp
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vscode/.vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ github.job }}-${{ steps.stamp.outputs.week }}
          restore-keys: vscode-test-${{ runner.os }}-${{ github.job }}-

      # package:vsix leaves out/ holding the minified production build, which
      # is the artifact the live label exists to test. A plain `pnpm build`
      # here would quietly test an unminified bundle instead.
      - run: pnpm package:vsix

      # Readiness is the suite's job, not a compose flag: it retries the first
      # write for up to 60s, so starting the tests a second after `up` is fine.
      - run: docker compose up -d

      - run: xvfb-run -a pnpm test:extension:live

      # The one job a contributor cannot reproduce without Docker, and a
      # container that never came up reaches the log as a single Mocha
      # assertion. Failure-only, so the green path pays nothing.
      - if: failure()
        run: docker compose ps && docker compose logs --tail=50

  conformance-live:
    name: conformance (live)
    runs-on: ubuntu-latest
    # Linux only, like the job above: the compose stack is the reason, and
    # running it three times would treble the cost for no extra signal. The
    # bound is the same too — vitest fails a wedged case, but nothing bounds a
    # container that never comes up, and the default is six hours of runner
    # time. The job really takes about a minute.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The providers resolve @omni-fs/core through dist/, so the suite would
      # run against a stale build without this.
      - run: pnpm build

      # --build because docker/sftp and docker/ftp are built here rather than
      # pulled. --wait is what makes the next step safe: only the FTP suite
      # retries its first call, so the other three would race a server that is
      # not yet listening. Every service here has a healthcheck that completes
      # a real exchange in its own protocol, and the two seed jobs are chained
      # ahead of the servers, so this returns once all four are answering and
      # their trees are in place.
      #
      # The four are named because `--wait` with no names also waits on the
      # seed jobs and reports their clean exit as a failure of the wait
      # (`container ... exited (0)`, exit code 1). Naming these still pulls the
      # seed jobs in as dependencies, and still waits for them.
      - run: docker compose up -d --build --wait minio sftp ftp webdav

      - run: pnpm test:conformance

      # The one job a contributor cannot reproduce without Docker, and a
      # container that never came up reaches the log as a single assertion.
      # Failure-only, so the green path pays nothing.
      - if: failure()
        run: docker compose ps && docker compose logs --tail=50

  boundary:
    name: architecture boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Backstop for the ESLint rule in eslint.config.js. The host-agnostic
      # boundary is the whole architecture (see docs/architecture.md) — if the
      # lint config is ever weakened or a file slips past an ignore pattern,
      # this still catches it.
      - name: packages/ must not import a host API
        run: |
          if grep -rnE "from '(vscode|electron)'" packages/ --include='*.ts' --include='*.tsx'; then
            echo "::error::packages/ must stay host-agnostic. Move this to apps/, or express it as a Port in @omni-fs/core/ports."
            exit 1
          fi
          echo "No host imports in packages/."

      - name: packages/core must not import a protocol SDK
        run: |
          if grep -rnE "from '(@aws-sdk/|basic-ftp|ssh2|webdav)" packages/core/src --include='*.ts'; then
            echo "::error::@omni-fs/core defines contracts only. Protocol code belongs in packages/provider-*."
            exit 1
          fi
          echo "No protocol SDKs in core."

  package:
    name: package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proves every PR still produces an installable .vsix, rather than
      # discovering a packaging break at release time. Goes through turbo so
      # the workspace packages are built first — the extension bundles their
      # dist output and cannot resolve them otherwise.
      - run: pnpm package:vsix

      - name: Check the bundle stayed lean
        run: |
          VSIX=$(ls apps/vscode/*.vsix)
          SIZE=$(( $(wc -c < "$VSIX") / 1024 ))
          echo "$VSIX is ${SIZE} KB"
          # A jump here almost always means .vscodeignore stopped excluding
          # something — sourcemaps, node_modules or stale build output.
          if [ "$SIZE" -gt 2048 ]; then
            echo "::error::VSIX grew past 2 MB (${SIZE} KB). Check apps/vscode/.vscodeignore."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omni-fs-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
