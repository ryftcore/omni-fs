name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest

    # Needs the dependency graph, which is free on public repos but requires
    # GitHub Advanced Security on private ones. Skips cleanly until then;
    # `pnpm audit` in supply-chain.yml covers the same ground meanwhile.
    if: github.event.repository.visibility == 'public'

    permissions:
      contents: read
      pull-requests: write # to leave the summary comment

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # omni-fs is MIT. A copyleft dependency would force a relicense, so
          # catch it at the PR rather than after release.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
