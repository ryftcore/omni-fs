name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and then "removed" in a later
          # commit is still in the pack and still leaked. Scanning only the tip
          # would miss exactly the case that matters.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI is MIT-licensed and free. The gitleaks-action wrapper
      # requires a paid licence for organisation-owned repos, and ryftcore is an
      # organisation — so install the binary directly and skip the wrapper.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Scan working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1
