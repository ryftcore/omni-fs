name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commit-titles:
    name: commit titles
    runs-on: ubuntu-latest

    # Bots generate their own message format and cannot be made to match
    # `:emoji: <type> <description>`: Dependabot always inserts a colon after
    # its configured prefix, producing `:arrow_up: build: Bump ...`. The
    # convention exists for human contributors, so skip bot PRs rather than
    # loosening the rule for everyone.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # omni-fs uses single-line commit titles: `:emoji: <type> <description>`
      # (see CONTRIBUTING.md). Checking it here keeps the history readable
      # without a commit-msg hook everyone has to install locally.
      - name: Validate commit message format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^:[a-z0-9_+-]+: (feat|fix|docs|refactor|test|build|chore|perf|style|ci) .+'
          failed=0

          while IFS= read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%b "$sha")

            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Bad commit title: '$subject'"
              echo "  Expected: :emoji: <type> <description>   e.g. ':sparkles: feat add SFTP provider'"
              failed=1
            fi

            if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "::error::Commit $sha has a body; omni-fs uses title-only commits."
              failed=1
            fi
          # --no-merges: a merge commit from main carries GitHub's own
          # "Merge branch ..." subject, which no contributor authored.
          done < <(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All commit titles conform."

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
