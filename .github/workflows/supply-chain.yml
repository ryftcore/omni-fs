name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: a dependency becomes vulnerable while you sleep, not while you edit.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unlike dependency-review, this works on a private repo today.
      - name: pnpm audit
        run: pnpm audit --audit-level moderate

  lockfile:
    name: lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # --frozen-lockfile already fails on drift, but saying so explicitly means
      # the failure reads as "someone edited package.json without installing"
      # rather than a generic install error.
      - name: Lockfile matches manifests
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: No unexpected install scripts
        run: |
          # allowBuilds in pnpm-workspace.yaml is an explicit allowlist of
          # packages permitted to run postinstall scripts. A new entry is a
          # supply-chain decision and should be reviewed, not absorbed.
          echo "Currently allowed to run install scripts:"
          sed -n '/^allowBuilds:/,/^$/p' pnpm-workspace.yaml
