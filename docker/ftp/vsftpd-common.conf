# Shared by all three listeners. Everything here is throwaway: the credentials
# are committed on purpose and must never be used anywhere real.
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=NO
xferlog_enable=YES
# vsftpd 3.0.5 has no "log to stdout" switch, and it cannot be given /dev/stdout
# either — the session child closes its own descriptors, so /proc/self/fd/1 is
# gone by the time it opens the log and every connection is answered with
# "500 OOPS: failed to open vsftpd log file". All three instances therefore log
# to one file and the entrypoint tails it, which is what makes
# `docker compose logs ftp` useful. The protocol log is on because a TLS
# listener that hangs says nothing without it.
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES

# Not chrooted, on purpose: the login directory is /data and the server's
# filesystem root stays reachable, which is what gives the absolute rootPrefix
# rule something real to name. docker/sftp does not chroot either.
chroot_local_user=NO

# Containers and vsftpd's sandbox do not agree, and the sandbox buys nothing
# for a throwaway test server.
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty

pasv_enable=YES
pasv_address=127.0.0.1
pasv_addr_resolve=NO

ssl_enable=YES
allow_anon_ssl=NO

# vsftpd defaults this on, and then answers every data connection whose TLS
# session is not resumed from the control connection with
# "522 SSL connection failed: session reuse required". basic-ftp does resume,
# but curl does not and neither do many real clients, so a server that demands
# it is not the common case worth testing against. Turning it off is therefore
# deliberate, and the cost is stated rather than hidden: **the session-reuse
# path is not covered by anything that runs against this container.**
require_ssl_reuse=NO
rsa_cert_file=/etc/vsftpd/vsftpd.crt
rsa_private_key_file=/etc/vsftpd/vsftpd.key
