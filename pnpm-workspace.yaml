packages:
  - packages/*
  - apps/*

# `pnpm audit --audit-level moderate` is a required check, and mocha 11 reaches
# serialize-javascript 6, which carries GHSA-5c6j-r48x-rmvq (high) and
# GHSA-qj8w-gfj5-8c6v (moderate). mocha fixed both by moving to ^7.1.1 in
# mocha 12 — which we cannot take, because @vscode/test-cli 0.0.15 (the latest)
# depends on mocha ^11.7.6. This pulls that one dependency forward to the
# version mocha 12 already uses, and nothing else. Drop it when test-cli
# supports mocha 12.
#
# The other two are the same shape: a patched release the parent's range does
# not reach yet. GHSA-68fv-2mgg-jv7q (high) is fixed in source-map-js 1.2.2,
# which postcss — under vite, under vitest — still resolves to 1.2.1. mocha 11
# pins diff ^7, and GHSA-73rr-hh4g-fpgx is fixed only in 8.0.3; mocha calls
# nothing but `createPatch` and `diffWordsWithSpace`, both unchanged in 8.
# GHSA-gfhx-hw2g-v5hg moved the serialize-javascript floor to 7.1.2.
overrides:
  diff: ^8.0.3
  serialize-javascript: ^7.1.2
  source-map-js: ^1.2.2

# GHSA-vfj7-8cjw-p6xm (braces, high) has no patched release: every braces is
# affected. It reaches us only as ovsx > @vscode/vsce > secretlint > globby >
# fast-glob > micromatch > braces, which expands the glob patterns vsce itself
# passes while packaging — never input from a remote server or a user, and
# never part of the .vsix. Remove this once braces ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Explicit allowlist so a fresh `pnpm install` is non-interactive for
# contributors. esbuild backs vitest; ssh2's install script is a native speedup
# for the SFTP provider; unrs-resolver backs eslint-plugin-import-x.
#
# cpu-features is denied on purpose: it is an optional ssh2 optimisation that
# needs node-gyp and a C++ toolchain, and it fails loudly on a machine without
# one. ssh2 falls back to its pure-JS crypto and works fine.
allowBuilds:
  '@vscode/vsce-sign': false
  cpu-features: false
  esbuild: true
  keytar: false
  ssh2: true
  unrs-resolver: true
