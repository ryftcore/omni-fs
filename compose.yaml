# Local servers for testing omni-fs against real protocols.
#
#   docker compose up -d      # start
#   docker compose down -v    # stop and delete all test data
#
# Everything here is throwaway: the credentials below are committed on purpose
# and must never be used anywhere real. Nothing binds to a public interface.
#
# S3, WebDAV, SFTP and FTP are all implemented, and `pnpm test:conformance`
# runs the shared suite against these servers.
#
#   docker compose up -d --build --wait minio sftp ftp webdav
#
# is the form CI uses and the one to prefer: every server here has a
# healthcheck that completes a real exchange in its own protocol, so `--wait`
# returns when the stack can actually answer rather than when the containers
# exist. Each of those checks polls once a second while a container is
# starting and then drops to once every 30s, because all three file servers
# log their connections and a healthcheck running every two seconds forever
# would be most of what `docker compose logs --tail=50` shows after a failure.
#
# The four services are named rather than left implicit because `--wait` with
# no names also waits on `minio-init` and `file-seed`, and reports their
# *clean* exit as a failure: `container ... exited (0)`, exit code 1. Naming
# the long-running four still pulls both seed jobs in as dependencies and
# still waits for them, because the chain below runs them ahead of the
# servers.

name: omni-fs-dev

services:
  # --- S3 -------------------------------------------------------------------
  # Console: http://localhost:9001  (omnifs / omnifs-dev-secret)
  #
  # Chainguard's build of MinIO. As of September 2026 quay.io refuses
  # anonymous pulls of MinIO's own images, `minio/minio` and `minio/mc`, and
  # Docker Hub no longer has them. Pinned by digest, which Dependabot bumps.
  #
  # It runs as a non-root user, so a `minio-data` volume that the old image
  # wrote as root is not writable by it: `docker compose down -v` once.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omnifs
      MINIO_ROOT_PASSWORD: omnifs-dev-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the buckets and a tree worth browsing: nested "directories" that do
  # not really exist on an object store, a file big enough for ranged reads,
  # and an empty bucket for the empty-listing case.
  minio-init:
    # The server image again, for its shell: Chainguard's `mc`-only image has
    # none, and this script needs one, and `head`.
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set dev http://minio:9000 omnifs omnifs-dev-secret
        mc mb --ignore-existing dev/omni-fs-test
        mc mb --ignore-existing dev/omni-fs-empty
        echo 'omni-fs test bucket' | mc pipe dev/omni-fs-test/readme.txt
        echo '# Guide'             | mc pipe dev/omni-fs-test/docs/guide.md
        echo 'three levels down'   | mc pipe dev/omni-fs-test/docs/nested/deep/deep.txt
        echo '{"ok":true}'         | mc pipe dev/omni-fs-test/data/sample.json
        head -c 3145728 /dev/urandom | mc pipe dev/omni-fs-test/data/large.bin
        mc ls --recursive dev/omni-fs-test
        echo "seed complete"
    restart: 'no'

  # --- SFTP -----------------------------------------------------------------
  sftp:
    build: ./docker/sftp
    depends_on:
      file-seed:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:2222:22'
    volumes:
      - sftp-data:/data
    healthcheck:
      # sshd sends its identification string before any key exchange, so this
      # is the cheapest thing that proves the server is answering rather than
      # merely running.
      test: ['CMD-SHELL', 'nc -w 2 127.0.0.1 22 </dev/null | grep -q "^SSH-2.0-"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # --- FTP / FTPS ------------------------------------------------------------
  # Three listeners, all serving the same /data volume as the same user:
  #   2121 -> 21    plain FTP and explicit AUTH TLS
  #   2990 -> 990   implicit TLS on connect
  #   2100 -> 2100  TLS 1.0 only, the legacy server tlsMinVersion exists for
  # Passive mode needs the data ports published too, or listings hang.
  ftp:
    build: ./docker/ftp
    depends_on:
      file-seed:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:2121:21'
      - '127.0.0.1:2990:990'
      - '127.0.0.1:2100:2100'
      - '127.0.0.1:21000-21032:21000-21032'
    volumes:
      - ftp-data:/data
    healthcheck:
      # All three listeners, because this container is three vsftpd instances
      # and two of them can be answering while the third never bound. 21 and
      # 2100 greet in the clear; 990 is TLS from the first byte, so its 220
      # only appears after a handshake.
      test:
        - CMD-SHELL
        - >-
          nc -w 2 127.0.0.1 21 </dev/null | grep -q '^220' &&
          nc -w 2 127.0.0.1 2100 </dev/null | grep -q '^220' &&
          echo QUIT | openssl s_client -connect 127.0.0.1:990 -quiet 2>/dev/null | grep -q '^220'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # --- WebDAV ---------------------------------------------------------------
  webdav:
    image: dgraziotin/nginx-webdav-nononsense:latest
    depends_on:
      file-seed:
        condition: service_completed_successfully
    environment:
      WEBDAV_USERNAME: omnifs
      WEBDAV_PASSWORD: omnifs-dev-secret
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - webdav-data:/data
    healthcheck:
      # A real PROPFIND rather than a GET: 207 Multi-Status is answered by the
      # WebDAV module, so this fails while nginx is up but the module is not,
      # and the credentials are exercised too — `-f` turns the 401 that a
      # broken htpasswd would return into a failure.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null -u omnifs:omnifs-dev-secret
          -X PROPFIND -H 'Depth: 0' http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # Gives the three file servers an identical tree, so the same manual test
  # works against each one. Runs once and exits.
  #
  # It seeds the volumes *before* the servers start, and the three servers
  # above name it as a `service_completed_successfully` dependency, so a
  # server that reports healthy is a server whose tree is already in place.
  # Waiting on health would otherwise be half an answer: vsftpd answers 220
  # from an empty directory just as readily.
  #
  # The dependency on `minio-init` is ordering, not data — this job never
  # touches S3. Chaining the two seeds makes "everything is seeded" a single
  # observable point, which is what lets the CI job wait for the servers and
  # get the buckets for free.
  file-seed:
    image: alpine:3.20
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        for d in /seed/sftp /seed/ftp /seed/webdav; do
          mkdir -p "$$d/docs/nested/deep" "$$d/data"
          echo 'omni-fs test file'  > "$$d/readme.txt"
          echo '# Guide'            > "$$d/docs/guide.md"
          echo 'three levels down'  > "$$d/docs/nested/deep/deep.txt"
          echo '{"ok":true}'        > "$$d/data/sample.json"
          head -c 1048576 /dev/urandom > "$$d/data/large.bin"
        done
        chown -R 1000:1000 /seed/sftp
        chown -R 1001:1001 /seed/ftp
        chown -R 911:1000  /seed/webdav
        echo "file seed complete"
    volumes:
      - sftp-data:/seed/sftp
      - ftp-data:/seed/ftp
      - webdav-data:/seed/webdav
    restart: 'no'

volumes:
  minio-data:
  sftp-data:
  ftp-data:
  webdav-data:
